<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Tejaswini 🤍</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

/* ================= FIRST SCREEN ================= */

#intro{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000 url("1000689430.png") center/cover no-repeat;
    transition:1.5s ease;
}

#intro.hide{
    opacity:0;
    transform:scale(1.08);
    pointer-events:none;
}

/* Click button */

.click-btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    padding:18px 55px;
    border-radius:50px;

    background:rgba(0,0,0,.75);
    color:#fff;

    border:1px solid #aaa;
    box-shadow:
        0 0 15px rgba(255,255,255,.35),
        inset 0 0 15px rgba(255,255,255,.1);

    font-size:22px;
    letter-spacing:5px;
    cursor:pointer;

    transition:.35s ease;
    z-index:20;
}

.click-btn:hover{
    transform:translate(-50%,-50%) scale(1.08);
    box-shadow:
        0 0 30px rgba(255,255,255,.8),
        inset 0 0 20px rgba(255,255,255,.2);
}

/* ================= BIRTHDAY SCREEN ================= */

#birthday{
    position:fixed;
    inset:0;
    z-index:1;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    pointer-events:none;

    transition:1.5s ease;
}

#birthday.show{
    opacity:1;
    pointer-events:auto;
}

/* YOUR ACTUAL TEJASWINI IMAGE */

.birthday-image{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;
}

/* Dark cinematic overlay */

.overlay{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(0,0,0,.35) 75%,
            rgba(0,0,0,.7)
        );

    pointer-events:none;
}

/* Birthday text */

.birthday-text{
    position:absolute;
    bottom:8%;

    width:100%;
    text-align:center;

    color:white;

    font-size:clamp(28px,6vw,70px);
    font-weight:bold;
    letter-spacing:8px;

    text-shadow:
        0 0 8px #fff,
        0 0 20px #aaa,
        0 0 40px #777;

    animation:textGlow 2s infinite alternate;
}

@keyframes textGlow{
    from{
        opacity:.75;
        transform:scale(.98);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* ================= HEART RAIN ================= */

#hearts{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    pointer-events:none;
}

/* cinematic flash */

.flash{
    position:fixed;
    inset:0;
    background:white;
    z-index:100;
    opacity:0;
    pointer-events:none;
}

.flash.active{
    animation:flash .8s ease;
}

@keyframes flash{
    0%{opacity:0}
    20%{opacity:.8}
    100%{opacity:0}
}
</style>
</head>

<body>

<!-- ================= FIRST SCREEN ================= -->

<section id="intro">

    <button class="click-btn" onclick="openBirthday()">
        CLICK
    </button>

</section>


<!-- ================= BIRTHDAY SCREEN ================= -->

<section id="birthday">

    <!-- YOUR UPLOADED GIRL IMAGE -->
    <img
        src="1000689437.png"
        class="birthday-image"
        alt="Tejaswini"
    >

    <div class="overlay"></div>

    <canvas id="hearts"></canvas>

    <div class="birthday-text">
        HAPPY BIRTHDAY TEJASWINI 🤍
    </div>

</section>

<div class="flash" id="flash"></div>


<script>

/* =========================================
   OPEN BIRTHDAY
========================================= */

function openBirthday(){

    const intro = document.getElementById("intro");
    const birthday = document.getElementById("birthday");
    const flash = document.getElementById("flash");

    flash.classList.add("active");

    setTimeout(() => {

        intro.classList.add("hide");
        birthday.classList.add("show");

        startHeartRain();

    },300);

}


/* =========================================
   HEART RAIN
========================================= */

function startHeartRain(){

    const canvas = document.getElementById("hearts");
    const ctx = canvas.getContext("2d");

    let hearts = [];

    function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    resize();

    window.addEventListener("resize",resize);


    function createHeart(){

        return {

            x:Math.random()*canvas.width,

            y:-30,

            size:
                Math.random()*18+10,

            speed:
                Math.random()*2+1,

            drift:
                Math.random()*1.5-0.75,

            rotation:
                Math.random()*Math.PI*2,

            rotationSpeed:
                Math.random()*.03-.015,

            opacity:
                Math.random()*.6+.35,

            /* white and silver */

            silver:
                Math.random()>.5

        };

    }


    for(let i=0;i<45;i++){

        let h=createHeart();

        h.y=Math.random()*canvas.height;

        hearts.push(h);

    }


    function drawHeart(h){

        ctx.save();

        ctx.translate(h.x,h.y);
        ctx.rotate(h.rotation);

        ctx.globalAlpha=h.opacity;

        let gradient=ctx.createLinearGradient(
            -h.size,
            -h.size,
            h.size,
            h.size
        );

        if(h.silver){

            gradient.addColorStop(0,"#ffffff");
            gradient.addColorStop(.45,"#c0c0c0");
            gradient.addColorStop(1,"#777777");

        }else{

            gradient.addColorStop(0,"#ffffff");
            gradient.addColorStop(1,"#dddddd");

        }

        ctx.fillStyle=gradient;

        ctx.beginPath();

        const s=h.size;

        ctx.moveTo(0,s*.35);

        ctx.bezierCurveTo(
            -s*1.4,-s*.35,
            -s*.65,-s*1.25,
            0,-s*.55
        );

        ctx.bezierCurveTo(
            s*.65,-s*1.25,
            s*1.4,-s*.35,
            0,s*.35
        );

        ctx.fill();

        ctx.restore();

    }


    function animate(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        hearts.forEach((h,index)=>{

            h.y += h.speed;
            h.x += h.drift;
            h.rotation += h.rotationSpeed;

            drawHeart(h);

            if(h.y > canvas.height+50){

                hearts[index]=createHeart();

            }

        });

        requestAnimationFrame(animate);

    }

    animate();

}

</script>

</body>
</html>
